<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f4ed"><title>يومي | مفكرتي الشخصية</title><style>
:root{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;color:#492d39;background:#f8f4ed}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8b697c}.account-gate{z-index:22}.lock[hidden]{display:none!important}.lock{position:fixed;inset:0;z-index:20;background:#f8f4ed;display:grid;place-items:center;padding:20px}.lock-card{width:min(390px,100%);background:#fffdfa;border:1px solid #e7d8cb;border-radius:26px;padding:28px;box-shadow:0 15px 50px #4a2f3d20;text-align:center}.lock-card input{width:130px;letter-spacing:.6em;text-align:center;font-size:1.8rem;padding:12px;border:1px solid #d8c9bb;border-radius:14px;margin:15px}.lock-card button{display:block;margin:10px auto}.error{color:#a3334d;min-height:24px}header{max-width:1100px;margin:auto;padding:25px 18px 10px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:2rem}h2{margin:0 0 16px;font-size:1.3rem}h3{margin:0 0 10px;font-size:1.05rem}.sub{color:#806d75;font-size:.9rem}main{max-width:1100px;margin:auto;padding:8px 18px 110px}.shell{display:grid;grid-template-columns:210px 1fr;gap:20px}.nav{position:sticky;top:20px;height:max-content;display:grid;gap:7px}.nav button,.tab{background:transparent;color:#604651;padding:12px 16px;text-align:right;border-radius:14px}.nav button.active,.tab.active,.primary{background:#ae8552;color:white}.panel{background:#fffdfa;border:1px solid #e8dfd5;box-shadow:0 9px 28px #715c4910;border-radius:23px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:17px;border-radius:18px;background:#f6efe8}.stat b{font-size:1.6rem;display:block;margin-top:5px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:#8c7880}.primary,.soft,.danger{padding:11px 17px;border-radius:13px}.soft{background:#f2e8dc;color:#704e5a}.danger{background:#fae7e8;color:#923e53}.field{display:grid;gap:6px;margin:10px 0;flex:1;min-width:140px}.field input,.field select,.field textarea{width:100%;border:1px solid #ded2c7;background:#fff;border-radius:12px;padding:11px;color:#492d39;min-height:46px}.field textarea{min-height:90px}.item{border-bottom:1px solid #efe8e1;padding:13px 0;display:flex;align-items:center;gap:12px}.item:last-child{border-bottom:0}.item .grow{flex:1;min-width:0}.item small{display:block;color:#8e7b82;margin-top:4px}.item button{padding:7px 10px;border-radius:9px;background:#f4ece5;color:#634655}.done{text-decoration:line-through;color:#998992}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.tab{text-align:center}.plant{display:flex;align-items:center;gap:18px;background:linear-gradient(110deg,#f5e8df,#f8f2ea);padding:18px;border-radius:20px}.plant-image{width:clamp(110px,22vw,185px);height:145px;object-fit:contain;flex:0 0 auto;transition:filter .3s}.plant-image.tired{filter:grayscale(.55);opacity:.72}.progress-ring{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;transition:background .4s}.progress-ring span{width:88px;height:88px;border-radius:50%;background:#fbf7f1;display:grid;place-items:center;font-size:1.5rem;font-weight:700}.plant-copy{flex:1}.plant-note{font-size:.86rem;color:#826976}.bar{height:12px;background:#ede3dc;border-radius:20px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:#a28460;border-radius:20px}.chart{display:flex;align-items:flex-end;gap:8px;height:170px;border-bottom:1px solid #dacdc2;padding-top:15px}.chartcol{flex:1;min-width:0;text-align:center}.chartcol .v{background:#a37b8e;min-height:3px;border-radius:6px 6px 0 0}.chartcol small{display:block;font-size:.75rem;white-space:nowrap;overflow:hidden}.notice{background:#f4eee6;border-radius:14px;padding:12px;margin:12px 0;color:#68505a}.empty{padding:22px;color:#8e7d83;text-align:center}dialog{border:0;border-radius:22px;box-shadow:0 16px 70px #35232b45;width:min(460px,92vw);padding:22px}dialog::backdrop{background:#2e1c2866}.mini{font-size:.82rem}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.badge{background:#e8efe8;color:#42644d;border-radius:20px;padding:5px 10px}.warning{background:#f9eadd;color:#946038}.hidden{display:none!important}@media(max-width:720px){header{padding:20px 16px 4px}main{padding:12px 13px 95px}.shell{display:block}.nav{position:fixed;bottom:0;top:auto;right:0;left:0;z-index:5;background:#fffdfa;border-top:1px solid #e9dfd6;display:flex;overflow-x:auto;padding:5px 8px;gap:2px;box-shadow:0 -7px 20px #46313b0c}.nav button{white-space:nowrap;min-width:70px;padding:9px 5px;text-align:center;font-size:.76rem}.panel{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.plant-image{width:100px;height:125px}.progress-ring{width:80px;height:80px}.progress-ring span{width:60px;height:60px;font-size:1rem}.plant{gap:8px}.plant-copy h3{font-size:.9rem}.plant-copy .sub{font-size:.72rem}}
</style></head><body><div class="lock" id="lock"><div class="lock-card"><div style="font-size:3.4rem">🌺</div><h2 id="lockTitle">رمز الدخول</h2><p id="lockHint" class="sub"></p><form id="pinForm"><label for="pinInput">رقمان فقط</label><br><input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]{2}" maxlength="2" autocomplete="off" required><button class="primary" id="pinSubmit">دخول</button></form><div id="pinError" class="error"></div></div></div><div class="lock account-gate" id="accountGate" hidden><div class="lock-card"><h2>حساب يومي</h2><p id="accountStatus" class="sub"></p><form id="accountForm"><label class="field">البريد الإلكتروني<input name="email" type="email" autocomplete="email" required></label><label class="field">كلمة المرور<input name="password" type="password" autocomplete="current-password" minlength="8" required></label><div class="row"><button class="primary" value="login">دخول</button><button class="soft" value="signup">إنشاء حساب</button></div></form></div></div><header><div><h1>يومي <span aria-hidden="true">✿</span></h1><div class="sub" id="todayLabel"></div></div><div class="row"><span id="cloudBadge" class="sub" hidden></span><button class="soft" id="signOutBtn" hidden>خروج</button><button class="soft" id="backupBtn">نسخة احتياطية</button></div></header><main class="shell"><nav class="nav" id="nav" aria-label="الصفحات"></nav><div id="view"></div></main><dialog id="backupDialog"><h2>بياناتك</h2><p>بياناتك محفوظة في هذا المتصفح على هذا الجهاز. صدّري نسخة احتياطية بانتظام، خصوصًا قبل مسح بيانات المتصفح أو تغيير الجهاز.</p><div class="row"><button class="primary" id="exportBtn">تصدير JSON</button><label class="soft" style="cursor:pointer">استيراد<input id="importInput" type="file" accept="application/json" hidden></label><button class="soft" onclick="document.querySelector('dialog').close()">إغلاق</button></div></dialog><script>
const PIN_KEY='yomi-pin-v1', KEY='yomi-private-v1', TZ='Asia/Jerusalem';const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});const today=()=>fmt.format(new Date());const dateLabel=d=>new Intl.DateTimeFormat('ar-PS',{day:'numeric',month:'long',year:'numeric',timeZone:TZ}).format(new Date(d+'T12:00:00+03:00'));const id=()=>crypto.randomUUID();const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initial=()=>({tasks:[],achievements:[],expenses:[],debts:[],reminders:[],notes:[],periods:[],restDays:[]});let data;try{data={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=initial()}let page='home', selected=today(), range='daily',financeTab='expenses';let save=()=>localStorage.setItem(KEY,JSON.stringify(data));const $=s=>document.querySelector(s);const daysBetween=(a,b)=>Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/86400000);const money=n=>Number(n||0).toLocaleString('en-US')+' ₪';const belongs=(d,r=range,base=selected)=>r==='daily'?d===base:r==='monthly'?d.slice(0,7)===base.slice(0,7):d.slice(0,4)===base.slice(0,4);const filtered=(arr,r=range)=>arr.filter(x=>belongs(x.date,r));const pct=(a,b)=>b?Math.round(a/b*100):0;const sum=a=>a.reduce((n,x)=>n+Number(x||0),0);const pages=[['home','يومي'],['tasks','مهامي'],['achievements','إنجازاتي'],['finance','مالي'],['reminders','تذكيرات'],['notes','ملاحظات'],['cycle','دورتي'],['reports','التقارير']];function nav(){ $('#nav').innerHTML=pages.map(([k,v])=>`<button class="${page===k?'active':''}" data-page="${k}">${v}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}function datePicker(){return `<label class="field">التاريخ<input id="dateSelect" type="date" value="${selected}"></label>`}function periodTabs(){return `<div class="tabs">${[['daily','يومي'],['monthly','شهري'],['yearly','سنوي']].map(([k,v])=>`<button class="tab ${range===k?'active':''}" data-range="${k}">${v}</button>`).join('')}</div>`}function common(){return `<div class="row between">${periodTabs()}${datePicker()}</div>`}function attachCommon(){const d=$('#dateSelect');if(d)d.onchange=e=>{selected=e.target.value||today();render()};document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;render()})}function tasksStats(r=range){let all=filtered(data.tasks,r);return [all.filter(x=>x.done).length,all.length]}function plant(){const lookback=Array.from({length:3},(_,i)=>{let d=new Date(today()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-i);return d.toISOString().slice(0,10)});const quiet=lookback.filter(d=>!data.restDays.includes(d)&&!data.tasks.some(x=>x.date===d&&x.done)&&!data.achievements.some(x=>x.date===d)).length;let total=data.tasks.filter(x=>x.done).length+data.achievements.length;let stage=total<3?1:total<8?2:total<16?3:4;let todays=data.tasks.filter(x=>x.date===selected), completed=todays.filter(x=>x.done).length;let percent=pct(completed,todays.length);let rest=data.restDays.includes(selected);return `<div class="plant"><img class="plant-image ${quiet>=3&&!rest?'tired':''}" src="assets/plant-${stage}.webp" alt="وردة الأناناس: مرحلة ${stage} من 4"><div class="plant-copy"><h3>وردة الأناناس</h3><div class="plant-note">${quiet>=3&&!rest?'وردتك بحاجة لخطوة صغيرة اليوم':rest?'اليوم راحة، ووردتك بخير':'كل إنجاز يسقي وردتك'}</div><div class="sub">${total} خطوة أنجزتيها · مرحلة ${stage} من 4</div></div><div class="progress-ring" style="background:conic-gradient(#bd925a ${percent}%,#eaded0 ${percent}%)" role="img" aria-label="إنجاز اليوم ${percent} بالمئة"><span>${rest?'راحة':percent+'٪'}</span></div></div>`}function bars(entries){let max=Math.max(1,...entries.map(x=>x.value));return `<div class="chart" role="img" aria-label="رسم بياني"><${''}div style="display:contents">${entries.map(x=>`<div class="chartcol"><div class="v" style="height:${Math.max(3,x.value/max*130)}px" title="${safe(x.label)}: ${x.value}"></div><small>${safe(x.label)}</small></div>`).join('')}</div></div>`}function home(){let [done,total]=tasksStats('daily');let rem=data.reminders.filter(x=>!x.done&&x.date>=selected).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];let spent=sum(data.expenses.filter(x=>x.date===selected).map(x=>x.amount));return `<div class="panel">${datePicker()}${plant()}<div class="grid" style="margin-top:14px"><div class="stat">إنجاز اليوم<b>${pct(done,total)}٪</b><span class="sub">${done} من ${total} مهمة</span></div><div class="stat">مصروف اليوم<b>${money(spent)}</b></div><div class="stat">الإنجازات المسجّلة<b>${data.achievements.filter(x=>x.date===selected).length}</b></div></div><div class="row" style="margin-top:15px"><button class="${data.restDays.includes(selected)?'primary':'soft'}" id="restBtn">${data.restDays.includes(selected)?'✓ يوم راحة':'تحديد يوم راحة'}</button><span class="sub">الراحة لا تخفض نسبة الإنجاز ولا تذبل الوردة</span></div></div><div class="split"><div class="panel"><h2>مهام اليوم</h2>${taskList(data.tasks.filter(x=>x.date===selected).slice(0,5))}<button class="soft" data-go="tasks">عرض المهام</button></div><div class="panel"><h2>التذكير القادم</h2>${rem?`<p>${safe(rem.title)} · ${dateLabel(rem.date)} ${safe(rem.time||'')}</p>`:'<div class="empty">ما في تذكيرات قادمة</div>'}<button class="soft" data-go="reminders">إضافة تذكير</button></div></div>`}function taskList(items){return items.length?items.map(x=>`<div class="item"><input type="checkbox" aria-label="إكمال ${safe(x.title)}" data-task-toggle="${x.id}" ${x.done?'checked':''}><div class="grow"><div class="${x.done?'done':''}">${safe(x.title)}</div><small>${safe(x.kind==='work'?'شغل':'شخصي')} · ${safe(x.date)}</small></div><button data-delete="tasks:${x.id}" aria-label="حذف">حذف</button></div>`).join(''):'<div class="empty">ما في عناصر مسجّلة بعد</div>'}function tasks(){let all=filtered(data.tasks);let [done,total]=tasksStats();return `<div class="panel"><h2>مهامي</h2>${common()}<div class="stat">معدل الإنجاز <b>${pct(done,total)}٪</b>${done} من ${total} مهمة${data.restDays.includes(selected)&&range==='daily'?' · يوم راحة، خارج الحساب':''}</div><form id="taskForm" class="row"><label class="field">مهمة جديدة<input name="title" required placeholder="مثلاً: تسليم تصميم الدعوة"></label><label class="field">النوع<select name="kind"><option value="personal">شخصي</option><option value="work">شغل</option></select></label><button class="primary">إضافة مهمة</button></form>${taskList(all)}</div>`}function achievements(){let arr=filtered(data.achievements);return `<div class="panel"><h2>إنجازاتي</h2>${common()}<form id="achForm" class="row"><label class="field">شو أنجزتِ؟<input name="title" required placeholder="مثلاً: نشرت ريلز جديد"></label><label class="field">المجال<select name="kind"><option value="work">شغلي</option><option value="personal">شخصي</option></select></label><button class="primary">تسجيل إنجاز</button></form>${['work','personal'].map(k=>`<h3>${k==='work'?'إنجازات الشغل':'إنجازات شخصية'}</h3>${list(arr.filter(x=>x.kind===k),'achievements')}`).join('')}</div>`}function list(arr,type,subtitle){return arr.length?arr.map(x=>`<div class="item"><div class="grow">${safe(x.title)}<small>${subtitle?subtitle(x):safe(x.date)}</small></div><button data-delete="${type}:${x.id}">حذف</button></div>`).join(''):'<div class="empty">ما في تسجيلات لهالفترة</div>'}function finance(){let exp=filtered(data.expenses),debt=data.debts.filter(x=>x.type==='owe'),owed=data.debts.filter(x=>x.type==='owed');let outstanding=a=>sum(a.map(x=>Math.max(0,Number(x.amount)-Number(x.paid||0))));return `<div class="panel"><h2>مالي</h2>${common()}<div class="grid"><div class="stat">مصاريف الفترة<b>${money(sum(exp.map(x=>x.amount)))}</b></div><div class="stat">المتبقي عليّ<b>${money(outstanding(debt))}</b></div><div class="stat">المتبقي إليّ<b>${money(outstanding(owed))}</b></div></div><div class="tabs" style="margin-top:16px">${[['expenses','مصاريفي'],['owe','عليّ دين'],['owed','إليّ مصاري']].map(([k,v])=>`<button class="tab ${financeTab===k?'active':''}" data-finance="${k}">${v}</button>`).join('')}</div>${financeTab==='expenses'?`<form id="expenseForm" class="row"><label class="field">على شو؟<input name="title" required></label><label class="field">المبلغ ₪<input name="amount" type="number" min="0.01" step="0.01" required></label><label class="field">التصنيف<select name="category"><option>أكل</option><option>مواصلات</option><option>شغل</option><option>فواتير</option><option>تسوق</option><option>أخرى</option></select></label><button class="primary">تسجيل مصروف</button></form>${list(exp,'expenses',x=>`${money(x.amount)} · ${safe(x.category)} · ${safe(x.date)}`)}`:`<form id="debtForm" class="row"><label class="field">الاسم أو السبب<input name="title" required></label><label class="field">المبلغ ₪<input name="amount" type="number" min="0.01" step="0.01" required></label><label class="field">موعد السداد أو الاستلام<input name="due" type="date"></label><button class="primary">تسجيل</button></form>${data.debts.filter(x=>x.type===financeTab).map(x=>`<div class="item"><div class="grow">${safe(x.title)}<small>الأصل ${money(x.amount)} · المدفوع ${money(x.paid)} · المتبقي ${money(Math.max(0,x.amount-x.paid))}${x.due?' · الموعد '+safe(x.due):''}</small></div><button data-payment="${x.id}">دفعة</button><button data-delete="debts:${x.id}">حذف</button></div>`).join('')||'<div class="empty">ما في ديون مسجّلة</div>'}`}</div><div class="panel"><h3>توزيع مصاريف الفترة</h3>${bars([...new Set(exp.map(x=>x.category))].map(c=>({label:c,value:sum(exp.filter(x=>x.category===c).map(x=>x.amount))})))}</div>`}function reminders(){let arr=[...data.reminders].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="panel"><h2>تذكيراتي</h2><form id="remForm" class="row"><label class="field">التذكير<input name="title" required></label><label class="field">التاريخ<input name="date" type="date" value="${selected}" required></label><label class="field">الوقت<input name="time" type="time" required></label><button class="primary">إضافة تذكير</button></form><div class="notice mini">التنبيه يظهر داخل التطبيق عندما تكون الصفحة مفتوحة. للتنبيه خارجها يلزم لاحقًا إعداد إشعارات عبر خدمة مناسبة.</div>${arr.map(x=>`<div class="item"><input type="checkbox" data-rem-toggle="${x.id}" aria-label="تم التذكير" ${x.done?'checked':''}><div class="grow ${x.done?'done':''}">${safe(x.title)}<small>${dateLabel(x.date)} · ${safe(x.time)}</small></div><button data-delete="reminders:${x.id}">حذف</button></div>`).join('')||'<div class="empty">ما في تذكيرات بعد</div>'}</div>`}function notes(){return `<div class="panel"><h2>ملاحظاتي</h2>${datePicker()}<form id="noteForm"><label class="field">شو صار اليوم؟<textarea name="title" required placeholder="اكتبي أفكارك أو تفاصيل يومك..."></textarea></label><button class="primary">حفظ ملاحظة</button></form>${list(data.notes.filter(x=>x.date===selected),'notes')}</div>`}function cycle(){let periods=[...data.periods].sort((a,b)=>b.start.localeCompare(a.start));let intervals=periods.slice(0,6).map((x,i)=>periods[i+1]?daysBetween(periods[i+1].start,x.start):0).filter(x=>x>=20&&x<=45);let avg=intervals.length?Math.round(sum(intervals)/intervals.length):null;let future=avg&&periods[0]?new Date(Date.parse(periods[0].start+'T12:00:00Z')+avg*86400000).toISOString().slice(0,10):null;return `<div class="panel"><h2>دورتي الشهرية</h2><div class="notice">التواريخ المتوقعة تقديرية وتعتمد على تسجيلاتك. هذه الصفحة خاصة بهذا المتصفح؛ استخدمي النسخة الاحتياطية بحذر.</div><div class="grid"><div class="stat">آخر بداية<b style="font-size:1.2rem">${periods[0]?dateLabel(periods[0].start):'—'}</b></div><div class="stat">متوسط الدورة<b>${avg?avg+' يوم':'—'}</b></div><div class="stat">البداية المتوقعة<b style="font-size:1.2rem">${future?dateLabel(future):'—'}</b></div></div><form id="cycleForm" class="row"><label class="field">أول يوم<input name="start" type="date" required value="${selected}"></label><label class="field">آخر يوم (اختياري)<input name="end" type="date"></label><label class="field">أعراض أو ملاحظة<input name="symptom" placeholder="ألم، تعب، مزاج..."></label><button class="primary">تسجيل الدورة</button></form>${periods.map(x=>`<div class="item"><div class="grow">${dateLabel(x.start)}${x.end?' — '+dateLabel(x.end):''}<small>${safe(x.symptom||'بدون ملاحظات')}</small></div><button data-delete="periods:${x.id}">حذف</button></div>`).join('')||'<div class="empty">سجّلي بداية دورتك لعرض سجلّها</div>'}</div>`}function reports(){let [done,total]=tasksStats();let achievements=filtered(data.achievements);let expenses=filtered(data.expenses);let entries=[];if(range==='daily')entries=Array.from({length:7},(_,i)=>{let d=new Date(selected+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-6+i);let key=d.toISOString().slice(0,10);return {label:key.slice(8),value:data.tasks.filter(x=>x.date===key&&x.done).length+data.achievements.filter(x=>x.date===key).length}});else {let count=range==='monthly'?new Date(Number(selected.slice(0,4)),Number(selected.slice(5,7)),0).getDate():12;entries=Array.from({length:count},(_,i)=>{let prefix=range==='monthly'?selected.slice(0,7)+'-'+String(i+1).padStart(2,'0'):selected.slice(0,4)+'-'+String(i+1).padStart(2,'0');return {label:String(i+1),value:data.tasks.filter(x=>x.date.startsWith(prefix)&&x.done).length+data.achievements.filter(x=>x.date.startsWith(prefix)).length}})}return `<div class="panel"><h2>التقارير</h2>${common()}<div class="grid"><div class="stat">إنجاز المهام<b>${pct(done,total)}٪</b>${done} / ${total}</div><div class="stat">إنجازات الشغل<b>${achievements.filter(x=>x.kind==='work').length}</b></div><div class="stat">المصاريف<b>${money(sum(expenses.map(x=>x.amount)))}</b></div></div></div><div class="panel"><h3>الإنجازات عبر الوقت</h3>${bars(entries)}<p class="sub">كل عمود يجمع المهام المكتملة والإنجازات المسجلة.</p></div><div class="panel">${plant()}</div>`}function render(){nav();$('#todayLabel').textContent=dateLabel(today());$('#view').innerHTML=({home,tasks,achievements,finance,reminders,notes,cycle,reports}[page])();attachCommon();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let [type,key]=b.dataset.delete.split(':');if(confirm('حذف هذا السجل؟')){data[type]=data[type].filter(x=>x.id!==key);save();render()}});document.querySelectorAll('[data-task-toggle]').forEach(b=>b.onchange=()=>{let x=data.tasks.find(x=>x.id===b.dataset.taskToggle);x.done=b.checked;save();render()});document.querySelectorAll('[data-rem-toggle]').forEach(b=>b.onchange=()=>{let x=data.reminders.find(x=>x.id===b.dataset.remToggle);x.done=b.checked;save();render()});document.querySelectorAll('[data-finance]').forEach(b=>b.onclick=()=>{financeTab=b.dataset.finance;render()});document.querySelectorAll('[data-payment]').forEach(b=>b.onclick=()=>{let x=data.debts.find(x=>x.id===b.dataset.payment);let n=Number(prompt('كم قيمة الدفعة بالشيكل؟'));if(Number.isFinite(n)&&n>0){x.paid=Math.min(x.amount,Math.round((Number(x.paid)+n)*100)/100);save();render()}});if($('#restBtn'))$('#restBtn').onclick=()=>{data.restDays=data.restDays.includes(selected)?data.restDays.filter(x=>x!==selected):[...data.restDays,selected];save();render()};const on=(sel,fn)=>{let el=$(sel);if(el)el.onsubmit=e=>{e.preventDefault();let f=new FormData(el);fn(f);save();render()}};on('#taskForm',f=>data.tasks.push({id:id(),title:f.get('title').trim(),kind:f.get('kind'),date:selected,done:false}));on('#achForm',f=>data.achievements.push({id:id(),title:f.get('title').trim(),kind:f.get('kind'),date:selected}));on('#expenseForm',f=>data.expenses.push({id:id(),title:f.get('title').trim(),amount:Number(f.get('amount')),category:f.get('category'),date:selected}));on('#debtForm',f=>data.debts.push({id:id(),title:f.get('title').trim(),type:financeTab,amount:Number(f.get('amount')),paid:0,due:f.get('due')}));on('#remForm',f=>data.reminders.push({id:id(),title:f.get('title').trim(),date:f.get('date'),time:f.get('time'),done:false}));on('#noteForm',f=>data.notes.push({id:id(),title:f.get('title').trim(),date:selected}));on('#cycleForm',f=>{let start=f.get('start'),end=f.get('end');if(end&&end<start){alert('آخر يوم لازم يكون بعد أول يوم');return}data.periods.push({id:id(),start,end,symptom:f.get('symptom').trim()})})}$('#backupBtn').onclick=()=>$('#backupDialog').showModal();$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({app:'yomi',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`yomi-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};$('#importInput').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(obj.app!=='yomi'||!obj.data||!Array.isArray(obj.data.tasks)||!Array.isArray(obj.data.periods))throw Error();if(!confirm('استيراد النسخة سيستبدل بيانات هذا الجهاز. متابعة؟'))return;data={...initial(),...obj.data};save();$('#backupDialog').close();render()}catch{alert('ملف النسخة الاحتياطية غير صالح')}};let alerted=new Set();setInterval(()=>{if(!$('#lock').classList.contains('hidden'))return;let now=new Date(),local=fmt.format(now),hour=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}).format(now);data.reminders.filter(x=>!x.done&&x.date===local&&x.time<=hour&&!alerted.has(x.id)).forEach(x=>{alerted.add(x.id);alert('تذكير: '+x.title)})},30000);render();function showPin(){let has=localStorage.getItem(PIN_KEY);$('#lockTitle').textContent=has?'أدخلي رقمك':'اختاري رقمًا من رقمين';$('#lockHint').textContent=has?'أدخلي الرقم لفتح يومي':'احفظي هذا الرقم؛ إذا نسيتيه، ما في طريقة لاسترجاعه من داخل التطبيق.';$('#pinInput').value='';$('#pinInput').focus()}$('#pinForm').onsubmit=e=>{e.preventDefault();let pin=$('#pinInput').value;if(!/^[0-9]{2}$/.test(pin)){$('#pinError').textContent='اكتبي رقمين فقط';return}let saved=localStorage.getItem(PIN_KEY);if(saved&&pin!==saved){$('#pinError').textContent='الرقم غير صحيح';$('#pinInput').value='';return}if(!saved)localStorage.setItem(PIN_KEY,pin);$('#lock').classList.add('hidden');$('#pinError').textContent='';window.dispatchEvent(new Event('yomi-pin-unlocked'))};showPin();
</script><script src="supabase-config.js" onerror="void 0"></script><script type="module" src="cloud.js"></script></body></html>
